## printer.cfg — Ender 5 + MKS Robin Nano V3.1 + tête Kobra 2 Pro (Klipper)
## Généré par Claude avec Pierre — 2026-09-12
## À placer dans ~/printer_data/config/printer.cfg sur le Raspberry Pi (ou via l'interface Mainsail/Fluidd).
##
## Sources principales :
## - Pinout mainboard MKS Robin Nano V3.1 : https://1coderookie.github.io/Kobra2ProInsights/hardware/mainboard/#wiring-and-pin-assignment
## - printer.cfg de référence (Robin Nano V3.1 + Kobra 2 Pro) :
##   https://github.com/1coderookie/Klipper4Kobra2series/blob/main/Kobra2Pro/MKS/Robin_Nano_v3.1/MKS-Nano-v31_K2Pro_printer.cfg
## - Config Marlin déjà auditée de Pierre (doc projet audit-configuration-marlin.md) pour les faits propres
##   à SON châssis Ender 5 (sens de homing X/Y, câblage des fins de course) — PAS repris de la référence Kobra,
##   qui est montée sur un châssis Kobra différent.
##
## ⚠️ PLACEHOLDERS À CALIBRER avant impression réelle (marqués TODO ci-dessous) :
##   - run_current des drivers (valeurs de départ prudentes, pas les vraies specs moteurs)
##   - rotation_distance de l'extrudeur (direct drive Kobra 2 Pro, ratio 4:1, moteur non documenté)
##   - position exacte du "poop collector" / station de nettoyage
##   - offset X/Y/Z de la sonde ABL par rapport à la buse (mesure physique après montage)

[include mainsail.cfg]

[mcu]
## Le Robin Nano V3.1 communique en USB (comme configuré dans le firmware, voir klipper.config fourni).
## Trouver le vrai chemin après avoir branché la carte en USB au Raspberry Pi :
##   ls /dev/serial/by-id/*
## puis remplacer la ligne ci-dessous par le résultat exact (usb-Klipper_stm32f407xx_XXXXXXXXXXXX-if00).
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_REMPLACER_MOI-if00

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

##################################################
# Axes X / Y / Z — pins fixes de la carte MKS Robin Nano V3.1
# (indépendants du châssis : valables que la tête/le cadre soit un Kobra ou un Ender 5)
##################################################

[stepper_x]
step_pin: PE3
dir_pin: !PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40          # 20 dents GT2 standard Ender-series — dérivé de l'ancien Configuration.h Marlin de Pierre (80 steps/mm @ 16 microsteps)
endstop_pin: ^!PA15
position_endstop: 0
position_min: 0
position_max: 220              # Volume Ender 5 / Ender 5 Pro (identiques), décision actée précédemment
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PD5
run_current: 0.650             # TODO(Pierre) : valeur de départ prudente — à ajuster selon l'étiquette du moteur X d'origine Ender 5
stealthchop_threshold: 999999   # StealthChop actif en permanence (silencieux) ; mettre 0 pour repasser en SpreadCycle si besoin de couple

[stepper_y]
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40          # idem X — 20 dents GT2 standard
endstop_pin: ^!PD2
position_endstop: 220          # Audit Marlin de Pierre : Y_HOME_DIR=1 / USE_YMAX_PLUG → fin de course Y au fond (max), pas au minimum
position_min: 0
position_max: 220
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PD7
run_current: 0.650             # TODO(Pierre) : idem X, à ajuster
stealthchop_threshold: 999999   # StealthChop actif en permanence (silencieux) ; mettre 0 pour repasser en SpreadCycle si besoin de couple

[stepper_z]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8           # Vis T8, dérivé de l'ancien Configuration.h Marlin de Pierre (400 steps/mm @ 16 microsteps)
endstop_pin: probe:z_virtual_endstop   # Pas de fin de course Z physique : la sonde ABL du Kobra 2 Pro sert de virtual endstop
position_min: -2
position_max: 300              # Z max Ender 5 / Pro — à revérifier une fois la tête Kobra montée (encombrement du bloc)
homing_speed: 8

[tmc2209 stepper_z]
uart_pin: PD4
run_current: 0.650             # TODO(Pierre) : à ajuster selon l'étiquette du moteur Z d'origine Ender 5
stealthchop_threshold: 999999   # StealthChop actif en permanence (silencieux) ; mettre 0 pour repasser en SpreadCycle si besoin de couple

##################################################
# Extrudeur — tête Kobra 2 Pro (direct drive, ratio 4:1)
##################################################

[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 7.5         # PLACEHOLDER — voir procédure de calibration en bas de fichier, ne pas imprimer sans calibrer
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PE5
sensor_type: EPCOS 100K B57560G104F   # Thermistance Kobra 2 Pro (100k NTC EPCOS B57560G104F), nom Klipper natif exact
sensor_pin: PC1
min_temp: 0
max_temp: 300
max_extrude_only_distance: 101.0
pressure_advance: 0.05          # valeur de départ raisonnable pour direct drive, à affiner (PRESSURE_ADVANCE_TEST)

[tmc2209 extruder]
uart_pin: PD9
run_current: 0.600             # TODO(Pierre) : moteur 42SHDB0066Z-10WD, courant non documenté publiquement → à calibrer empiriquement (voir procédure)
stealthchop_threshold: 999999   # StealthChop actif en permanence (silencieux) ; mettre 0 pour repasser en SpreadCycle si besoin de couple

##################################################
# Plateau chauffant
##################################################

[heater_bed]
heater_pin: PA0
sensor_type: ATC Semitec 104GT-2   # Thermistance de plateau générique la plus courante sur cartes MKS — À VÉRIFIER contre l'étiquette réelle du plateau Ender 5
sensor_pin: PC0
min_temp: 0
max_temp: 120
control: pid
# TODO(Pierre) : lancer PID_CALIBRATE HEATER=heater_bed TARGET=60 une fois câblé, puis remplacer par les vraies valeurs pid_kp/pid_ki/pid_kd

##################################################
# Ventilateurs — tête Kobra 2 Pro
##################################################

[fan]
# Ventilateur de couche (part cooling), piloté par le slicer
pin: PC14

[heater_fan heatsink_fan]
# Ventilateur du dissipateur/hotend — tourne dès que la buse chauffe
pin: PB1
heater: extruder
heater_temp: 50.0

##################################################
# Sonde ABL (capteur inductif intégré à la tête Kobra 2 Pro)
##################################################

[probe]
## Signal LEVEL câblé sur le connecteur BLTOUCH (PA8), comme dans le montage de référence.
## Signal déjà logique (pas de conversion PNP→NPN nécessaire) — voir doc projet pour le raisonnement complet.
## ⚠️ Vérifier au multimètre AVANT le premier branchement définitif (repos/déclenché, doit rester 0–3.3V/5V).
pin: ^PA8
x_offset: 0                     # TODO(Pierre) : mesurer l'offset X réel sonde↔buse une fois la tête montée
y_offset: 0                     # TODO(Pierre) : idem Y
z_offset: 0.5                   # TODO(Pierre) : à calibrer avec PROBE_CALIBRATE
speed: 3.0
samples: 2
sample_retract_dist: 3.0
samples_result: median

[safe_z_home]
home_xy_position: 110, 110      # centre du plateau 220x220 — point sûr avant de descendre en Z
speed: 100
z_hop: 10

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 200, 200
probe_count: 5, 5
algorithm: bicubic

##################################################
# Accéléromètre LIS2DW12 (tête Kobra 2 Pro) — bus SPI1 via EXP2
# C'est précisément le bus libéré par le passage de l'écran TS35 vers le Raspberry Pi.
##################################################

[lis2dw]
cs_pin: PE10
spi_bus: spi1
axes_map: x,y,z

[resonance_tester]
accel_chip: lis2dw
probe_points:
    110, 110, 20      # centre du plateau — ajuster une fois la machine assemblée

[input_shaper]
# Laisser vide au premier démarrage : lancer SHAPER_CALIBRATE après le premier test d'impression réussi,
# puis reporter ici les fréquences/types trouvés pour shaper_freq_x / shaper_freq_y / shaper_type_x / shaper_type_y.

##################################################
# Canal laser (E1) — PLACEHOLDER, non câblé/décidé
##################################################

# [output_pin laser]
# TODO(Pierre) : une fois le câblage/déclenchement du module laser décidé, remplacer par le vrai pin PWM
# (probablement la sortie chauffe E1 libre du Robin Nano réutilisée en PWM simple via [output_pin], plutôt
# qu'un vrai second extrudeur — Klipper ne nécessite pas de déclarer un "second extrudeur" pour ça).
# pin: <à définir>
# pwm: True
# value: 0
# shutdown_value: 0
# cycle_time: 0.001

##################################################
# G-code de démarrage personnalisé (home / chauffe / purge / nettoyage / bed mesh)
# Reprend la séquence validée avec Pierre (doc projet start-gcode-ender5-kobra.md), adaptée en macro Klipper.
# Le slicer appelle simplement : START_PRINT BED_TEMP=... EXTRUDER_TEMP=...
# Klipper connaît alors directement les vraies températures du slicer — plus besoin du compromis
# slicer/OctoPrint qu'on avait envisagé avant la bascule vers Klipper.
##################################################

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}

    ; ---- Homing ----
    G28

    ; ---- Mise en chauffe (bed + hotend en parallèle) ----
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}

    ; ---- Déplacement vers le poste de nettoyage (X0, Y max) ----
    ; TODO(Pierre) : ajuster ces coordonnées à l'emplacement réel du "poop collector" une fois installé.
    G1 X0 Y220 F6000

    ; ---- Purge à vide de 5cm dans le collecteur ----
    G91
    G1 E50 F150
    G90
    G92 E0

    ; ---- Bed mesh (avec la sonde ABL du Kobra 2 Pro) ----
    BED_MESH_CALIBRATE

    ; ---- Prêt pour l'impression ----
    G1 Z5 F600

[gcode_macro END_PRINT]
gcode:
    M104 S0
    M140 S0
    G91
    G1 E-2 F300
    G1 Z10 F600
    G90
    G28 X Y
    M84

[display_status]

[pause_resume]

[virtual_sdcard]
path: ~/printer_data/gcodes

[respond]
